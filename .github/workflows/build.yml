name: Build Pixal3D RunPod Image

on:
  workflow_dispatch:
    inputs:
      pixal3d_ref:
        description: "Pixal3D git ref to bake into the image (branch or commit SHA)"
        required: false
        default: "master"
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: pixal3d-runpod-serverless

jobs:
  build:
    name: Build and push GHCR image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          docker system prune -af || true
          df -h

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            PIXAL3D_REF=${{ github.event.inputs.pixal3d_ref || 'master' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
